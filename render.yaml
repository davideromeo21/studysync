services:
  - type: web
    name: studysync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.port $PORT --server.headless true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Uncomment and set DATABASE_URL if using an external PostgreSQL:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: studysync-db
      #     property: connectionString

# Optional: provision a free PostgreSQL database on Render
# databases:
#   - name: studysync-db
#     plan: free
